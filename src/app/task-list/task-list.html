<h1>Mes tâches</h1>

<div class="layout">
  <!-- Colonne gauche : formulaire + filtres -->
  <aside class="card" aria-label="Formulaire et filtres">
    <h2>Nouvelle tâche</h2>
    <form (ngSubmit)="addTask()">
      <label for="title">Titre *</label>
      <input
        id="title"
        name="title"
        [(ngModel)]="title"
        [attr.aria-invalid]="title && errors.title ? true : null"
        [attr.aria-describedby]="title && errors.title ? 'title-error' : null"
      />
      @if (title && errors.title) {
        <p id="title-error" class="error" role="alert">{{ errors.title }}</p>
      }

      <label for="description">Description</label>
      <textarea id="description" name="description" [(ngModel)]="description"></textarea>

      <label for="dueDate">Échéance</label>
      <input
        id="dueDate"
        name="dueDate"
        type="date"
        [min]="today"
        [(ngModel)]="dueDate"
        [attr.aria-invalid]="errors.dueDate ? true : null"
        [attr.aria-describedby]="errors.dueDate ? 'dueDate-error' : null"
      />
      @if (errors.dueDate) {
        <p id="dueDate-error" class="error" role="alert">{{ errors.dueDate }}</p>
      }

      <button type="submit" [disabled]="title.trim().length < 3 || !!errors.dueDate">Ajouter</button>
    </form>

    <hr />

    <h2>Filtres</h2>
    <p>{{ todoCount() }} à faire / {{ doneCount() }} faites</p>

    <label for="status">Statut</label>
    <select id="status" [(ngModel)]="status">
      <option value="all">Toutes</option>
      <option value="todo">À faire</option>
      <option value="done">Faites</option>
    </select>

    <label for="search">Rechercher</label>
    <input id="search" type="search" [(ngModel)]="query" />
  </aside>

  <!-- Colonne droite : liste avec scroll interne -->
  <section class="task-scroll card" aria-label="Liste des tâches">
    <ul>
      @for (task of visibleTasks(); track task.id) {
        <li>
          <app-task-item
            [task]="task"
            (toggled)="taskService.toggle($event)"
            (removed)="taskService.remove($event)"
            (saved)="taskService.update($event.id, $event.title, $event.description, $event.dueDate)"
          />
        </li>
      } @empty {
        <li class="empty">Aucune tâche à afficher.</li>
      }
    </ul>
  </section>
</div>
