@if (editing) {
  <form class="edit" (ngSubmit)="save()" (keyup.escape)="editing = false">
    <label [for]="'title-' + task().id">Titre</label>
    <input
      [id]="'title-' + task().id"
      name="title"
      [(ngModel)]="title"
      autofocus
      [attr.aria-invalid]="errors.title ? true : null"
      [attr.aria-describedby]="errors.title ? 'title-edit-error-' + task().id : null"
    />
    @if (errors.title) {
      <p [id]="'title-edit-error-' + task().id" class="error" role="alert">{{ errors.title }}</p>
    }

    <label [for]="'description-' + task().id">Description</label>
    <textarea
      [id]="'description-' + task().id"
      name="description"
      [(ngModel)]="description"
    ></textarea>

    <label [for]="'dueDate-' + task().id">Échéance</label>
    <input
      [id]="'dueDate-' + task().id"
      name="dueDate"
      type="date"
      [min]="today"
      [(ngModel)]="dueDate"
      [attr.aria-invalid]="errors.dueDate ? true : null"
      [attr.aria-describedby]="errors.dueDate ? 'dueDate-edit-error-' + task().id : null"
    />
    @if (errors.dueDate) {
      <p [id]="'dueDate-edit-error-' + task().id" class="error" role="alert">{{ errors.dueDate }}</p>
    }

    <button type="submit" [disabled]="title.trim().length < 3 || !!errors.dueDate">Enregistrer</button>
    <button type="button" (click)="editing = false">Annuler</button>
  </form>
} @else {
  <div class="task" [class.done]="task().done">
    <input
      type="checkbox"
      [id]="'check-' + task().id"
      [checked]="task().done"
      (change)="toggled.emit(task().id)"
      [attr.aria-label]="'Marquer la tâche « ' + task().title + ' » comme ' + (task().done ? 'non faite' : 'faite')"
    />
    <div class="task-text">
      <label [for]="'check-' + task().id">{{ task().title }}</label>
      @if (task().description) {
        <p>{{ task().description }}</p>
      }
      <small>
        {{ task().done ? 'Fait' : 'À faire' }}
        @if (task().dueDate) {
          – échéance : {{ task().dueDate }}
        }
      </small>
    </div>
    <button
      type="button"
      (click)="startEdit()"
      [attr.aria-label]="'Modifier la tâche « ' + task().title + ' »'"
    >
      Modifier
    </button>
    <button
      type="button"
      class="danger"
      (click)="remove()"
      [attr.aria-label]="'Supprimer la tâche « ' + task().title + ' »'"
    >
      Supprimer
    </button>
  </div>
}
